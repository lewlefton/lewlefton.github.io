title: Lew Lefton
description: "Mathematician. Comedian. Maker."
url: "https://lewlefton.com"
remote_theme: mmistakes/minimal-mistakes
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "comedy"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "personal"
    values:
      layout: single
      author_profile: true

collections:
  publications:
    output: true
    permalink: /professional/:path/
  comedy:
    output: true
    permalink: /comedy/:path/
  projects:
    output: true
    permalink: /projects/:path/
  personal:
    output: true
    permalink: /personal/:path/

author:
  name: Lew Lefton
  avatar: "/assets/images/lew_headshot_square.jpg"
  bio: "Mathematician, Comedian, Maker, Technology Leader"
  location: "Decatur, GA"
