<div class="tile-grid-wrapper">
  {% for tile in include.tiles %}
    <div class="tile-item">
      <div class="archive__item">
        
        <div class="archive__item-teaser">
          <a href="{{ tile.url | relative_url }}">
            <img src="{{ tile.image_path | relative_url }}" alt="{{ tile.alt }}" />
          </a>
        </div>

        <div class="archive__item-body">
          <h2 class="archive__item-title">
            <a href="{{ tile.url | relative_url }}">{{ tile.title }}</a>
          </h2>
          <div class="archive__item-excerpt">
            <p>{{ tile.excerpt }}</p>
          </div>
        </div>

      </div>
    </div>
  {% endfor %}
</div>

<style>
/* 1. The Container */
.tile-grid-wrapper {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 20px;
}

/* 2. The Items */
.tile-item {
  width: calc(50% - 10px);
  box-sizing: border-box;
  margin-bottom: 0;
}

/* 3. Mobile Responsiveness */
@media (max-width: 600px) {
  .tile-item {
    width: 100%;
  }
}

/* 4. Image Styling */
.archive__item-teaser img {
  width: 100%;
  height: auto;
  object-fit: cover;
  margin-bottom: 0.5em;
}

/* 5. THE FIX: Remove the Blue Focus Artifacts */
.archive__item-teaser a:focus, 
.archive__item-teaser a:active {
  outline: none !important;
  box-shadow: none !important;
  border: none !important;
}
</style>
